name: Build Flashlight APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir output
          cp app/build/outputs/apk/debug/app-debug.apk output/Flashlight.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flashlight
          path: output/Flashlight.apk
